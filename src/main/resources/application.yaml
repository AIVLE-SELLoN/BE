spring:
  application:
    name: sellon

  jwt:
    secret: pT+HzrT8gQkRpGJzxrfEFiS2yZPLClVhRxn3GuRIq2U=
    tokens:
      expire:
        access_token: 1800000
        refresh_token: 2592000000

  cursor:
    secret: pL2URxS9qn80k2DLiSwZ4CplPqXOsLoAWFnVrf0YYlY=

  datasource:
    url: jdbc:postgresql://localhost:5432/sellon
    driver-class-name: org.postgresql.Driver
    username: postgres
    password:


  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true


  data:
    redis:
      # 로컬 개발: localhost의 redis 컨테이너 / 배포: ElastiCache Primary Endpoint(Cluster Mode Disabled)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    from: sellon_info@sellon.site
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        debug: true

  verification:
    code:
      expire: 300000
    token:
      expire: 1800000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

file:
  storage-type: local   # local | s3 (S3 전환 시 s3로 변경, 관련 설정 추가 필요)
  upload-dir: ./uploads
  # s3:
  #   bucket: {버킷명}
  #   presigned-url-expire-minutes: 10

sellon:
  admin:
    register-key: ${ADMIN_REGISTER_KEY}