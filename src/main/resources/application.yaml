# OpenSearch는 로컬/배포 모두 환경변수로만 접속하는 구조라 프로필 공통으로 둔다
aws:
  opensearch:
    host: ${AWS_OPENSEARCH_HOST}
    region: ${AWS_OPENSEARCH_REGION:ap-northeast-2}
    access-key: ${AWS_OPENSEARCH_ACCESS_KEY}
    secret-key: ${AWS_OPENSEARCH_SECRET_KEY}

report:
  download-url:
    expire: 604800000 # 7일 (ms)
