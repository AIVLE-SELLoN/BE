spring:
  application:
    name: sellon

  profiles:
    active: local

  jwt:
    secret: pT+HzrT8gQkRpGJzxrfEFiS2yZPLClVhRxn3GuRIq2U=
    tokens:
      expire:
        access_token: 1800000
        refresh_token: 2592000000

  cursor:
    secret: pL2URxS9qn80k2DLiSwZ4CplPqXOsLoAWFnVrf0YYlY=

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  verification:
    code:
      expire: 300000
