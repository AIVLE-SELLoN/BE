spring:
  jwt:
    secret: ${JWT_SECRET}

  cursor:
    secret: ${CURSOR_SECRET}

  jpa:
    hibernate:
      # TODO: 최초 스키마 부트스트랩용 임시 조치. 정상 기동 확인되면 validate로 되돌릴 것.
      ddl-auto: update

  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    sslmode: require

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      # ElastiCache 전송 중 암호화가 켜져 있어 AUTH 토큰 + TLS가 필수다.
      password: ${REDIS_AUTH_TOKEN}
      ssl:
        enabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    from: sellon_info@sellon.site
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        prefetch: 20

cloud:
  aws:
    region: ap-northeast-2
    s3:
      report:
        bucket: ${AWS_S3_REPORT_BUCKET}
        access-key: ${AWS_S3_REPORT_ACCESS_KEY}
        secret-key: ${AWS_S3_REPORT_SECRET_KEY}
      image:
        bucket: ${AWS_S3_IMAGE_BUCKET}
        access-key: ${AWS_S3_IMAGE_ACCESS_KEY}
        secret-key: ${AWS_S3_IMAGE_SECRET_KEY}

# TODO: 실제 prod raw-db 접속 정보로 확정 필요 (env var 이름은 가정)
raw-db:
  sslmode: require
  datasource:
    url: ${RAW_DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${RAW_DB_USERNAME}
    password: ${RAW_DB_PASSWORD}
